name: WHERE7 quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    name: Tests, atlas assets, types and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test game rules and presentation
        run: npm test
      - name: Verify interactive map files and layout safeguards
        run: node scripts/verify-atlas.mjs
      - name: Verify content revisions, scheduling, reports and database permissions
        run: npm run test:content-db
      - name: Check TypeScript
        run: npm run typecheck
      - name: Compile production app
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Verify expedition requests and recovery against a local demo server
        run: npm run test:flow

      - name: Verify content API flows against isolated PostgreSQL
        run: npm run test:content-flow
